[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Interactive demo companion for an auditable equity factor research project."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["quantitative-finance", "factor-investing", "streamlit", "backtesting", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "plotly>=5.18",
  "streamlit>=1.57,<2",
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/WenqiDing-CompFin/quant-factor-lab"
Issues = "https://github.com/WenqiDing-CompFin/quant-factor-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"streamlit_app.py" = ["E402"]
"tests/*" = ["E402", "S101"]
